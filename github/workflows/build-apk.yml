name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Capacitor project
        run: |
          test -f index.html || (echo "index.html must be in the repo root" && exit 1)
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "رفيق الطريق الإسلامي" com.islamic.carcompanion --web-dir www
          npx cap add android

      - name: Force landscape orientation
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity\b/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          grep -q sensorLandscape "$MANIFEST" || (echo "orientation patch failed" && exit 1)

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-car-companion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
